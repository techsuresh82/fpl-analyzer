name: FPL Weekly Analysis

on:
  schedule:
    - cron: '0 9 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run FPL Analysis
        env:
          FPL_TEAM_IDS: ${{ vars.FPL_TEAM_IDS || secrets.FPL_TEAM_IDS }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: |
          echo "Using team IDs: ${FPL_TEAM_IDS:-${FPL_TEAM_ID:-NOT_SET}}"
          python fpl_analyzer.py

      - name: Validate report exists
        run: |
          test -f fpl_report.md
          ls -lh fpl_report.md

      - name: Create Issue with Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('fpl_report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `FPL Weekly Analysis - ${new Date().toISOString().split('T')[0]}`,
              body: report,
              labels: ['fpl-analysis', 'weekly-report']
            });

      - name: Commit report to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fpl_report.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update FPL weekly report - $(date +'%Y-%m-%d')"
          git push
